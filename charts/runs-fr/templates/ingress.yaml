{{- if .Values.ingress.enabled }}
# Ingress is rendered ONLY when ingress.enabled=true. Enable it ONLY behind a
# forward-auth proxy that sets the auth header — direct access bypasses auth
# (see SECURITY MODEL in values.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "runs-fr.fullname" . }}
  labels:
    {{- include "runs-fr.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "runs-fr.fullname" . }}
                port:
                  name: http
{{- end }}
