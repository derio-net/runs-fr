apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runs-fr.fullname" . }}
  labels:
    {{- include "runs-fr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "runs-fr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "runs-fr.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "runs-fr.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # Numeric UID/GID is required: the distroless image declares USER by
        # name ("nonroot"), which kubelet cannot verify against runAsNonRoot
        # ("non-numeric user, cannot verify user is non-root"). 65532 is the
        # distroless `nonroot` uid/gid.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The distroless static binary needs no writable filesystem, no extra
          # capabilities, and never escalates — matches the repo's hardened-pod
          # convention.
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: NAMESPACE
              value: {{ include "runs-fr.watchNamespace" . | quote }}
            - name: LABEL_SELECTOR
              value: {{ .Values.labelSelector | quote }}
            - name: AUTH_HEADER
              value: {{ .Values.authHeader | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
