name: build
# Per-commit image for the staging-gate. Every push to main builds + pushes
# ghcr.io/derio-net/runs-fr:sha-<short> and fires a repository_dispatch
# (event_type=staging-gate) that triggers Frank's Tekton gate. The `v*` release
# build (release.yml) is unchanged — that's for explicit human releases.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.short.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: short
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/derio-net/runs-fr
          # type=sha yields `sha-<short>` — the exact tag the gate references
          # (frank contract / bump-staging use sha-$(sha)).
          tags: type=sha
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive smoke tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/derio-net/runs-fr-smoke
          tags: type=sha
      - name: Build and push smoke image
        uses: docker/build-push-action@v6
        with:
          context: test/e2e
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  trigger-gate:
    needs: [image, smoke-image]
    runs-on: ubuntu-latest
    steps:
      - name: Fire staging-gate repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/dispatches \
            -f event_type=staging-gate \
            -F client_payload[app]=runs-fr \
            -F client_payload[sha]=${{ needs.image.outputs.sha }}
