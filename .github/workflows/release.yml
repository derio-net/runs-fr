name: release

# Build and publish the container image on tag pushes. The image is tagged with
# both the pushed git tag (e.g. v1.2.3) and the commit SHA, so deployments can
# pin either a release or an exact build.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/derio-net/runs-fr
          # Three tags per release: the pushed git tag (v0.1.0), the bare
          # semver version (0.1.0 — matches the chart's appVersion-derived
          # default so `helm install` resolves a real image), and the commit
          # SHA (sha-<short>) for exact-build pinning.
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
