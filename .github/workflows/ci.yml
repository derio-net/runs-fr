name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The frontend bundle is embedded via //go:embed into cmd/runs-fr, so it
      # must be built before any go vet/test/build step compiles that package.
      - name: frontend
        run: make frontend

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -race

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.3

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: chart lint + golden assertions
        run: ./charts/runs-fr/test/assert.sh
