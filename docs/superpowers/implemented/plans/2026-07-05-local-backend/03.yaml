      by term.session.handleControl; existing `go test ./internal/term/`
      stays green (pure refactor, no behavior change).
- number: 2
  title: PTY attacher (TDD)
  steps:
  - id: P3.T2.S1
    text: |
      RED: `internal/localterm/attacher_test.go`: NewAttacher with an
      injectable command factory; test factory returns
      `exec.Command("cat")` (instead of tmux attach). Using a fake
      wsConn-style pair: write binary "hello\n" inbound → outbound
      binary frame contains "hello" (cat echo through the PTY); a text
      frame `{"resize":{"cols":80,"rows":24}}` is consumed without
      leaking into stdin; closing the ws side ends Attach without
      hanging (t.Deadline guard). `go test ./internal/localterm/` → fail.
  - id: P3.T2.S2
    text: |
      GREEN: implement `attacher.go`: default factory builds
      `tmux [-S socket] attach -t =<session>`; `pty.Start(cmd)`; pump
      goroutines: ws binary → pty write; pty read → ws binary; ws text →
      ParseResize → `pty.Setsize`; first resize applied before/asap
      after start; on ws error or pty EOF: kill process group + close.
      Add `github.com/creack/pty` to go.mod. PASS with `-race`.
