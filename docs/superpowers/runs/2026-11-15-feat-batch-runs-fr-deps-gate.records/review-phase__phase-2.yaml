  - id: p2-r1
    state: fixed
    body: "renovate.json: allowedVersions /^\\d+\\.\\d+\\.0$/ on the gomod golang depType alongside rangeStrategy bump. Re-ran --dry-run=lookup: the go directive now has no updates and the go-toolchain branch is gone (toolchain is already at 1.27.4); a new minor's .0 would still be proposed. Spec drift policy rewritten to match."
  - id: p2-r2
