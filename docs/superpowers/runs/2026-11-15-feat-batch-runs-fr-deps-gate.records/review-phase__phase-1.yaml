journal:
  - kind: finding
    id: p1-r1
    phase: 1
    review_scope: in
    title: "pins test fails when go.mod has no toolchain line, which cmd/go/tidy produces when toolchain equals the go directive"
    body: "test/pins/pins_test.go:89-92 made a missing toolchain line fatal; cmd/go drops a toolchain line equal to the go directive, which phase-2 Renovate (rangeStrategy bump + gomodTidy) makes likely."
  - kind: finding
    id: p1-r2
    phase: 1
    review_scope: in
    title: "issue step fired on any job failure (and on govulncheck errors, exit 1) but always titled it 'reachable vulnerability'"
    body: "ci.yml:84 `if: failure()` covered checkout/setup-go/vuln-DB failures too."
  - kind: finding
    id: p1-r3
    phase: 1
    review_scope: in
    title: "issues: write sat on the scan job (with persisted checkout creds) for every PR/push run"
    body: "ci.yml:58-66; only the scheduled failure path needs a write scope."
  - kind: finding
    id: p1-r4
    phase: 1
    review_scope: in
    title: "setup-go@v5 installs 1.27.0 then auto-downloads go1.27.4, colliding with the cache restore; spec claimed setup-go honours the toolchain line"
    body: "ci.yml:27-30,68-71; run 43692080590 logged ~24k tar 'File exists' lines. Correct result (go1.27.4 runs), false spec claim, noisy logs. setup-go v6 is barred by R10."
  - kind: finding
    id: p1-r5
    phase: 1
    review_scope: in
    title: "k8s v0.36/v0.37 rung commits ship the broken SPDY fallback; the fix lands two commits later, contrary to R2"
    body: "7d78940 and 4144a8c pass tests only because fallback_test.go did not exist yet; 851b2fa fixes it."
  - kind: finding
    id: p1-r6
    phase: 1
    review_scope: in
    title: "Dockerfile build-stage regex rejected a digest-pinned golang image with a misleading message"
    body: "test/pins/pins_test.go:79 reBuildStage had no `@sha256:` allowance."
  - kind: finding
    id: p1-r7
    phase: 1
    review_scope: in
    title: "attacher_test receive change looked like churn rather than a lint finding"
    body: "internal/localterm/attacher_test.go:100 `case <-done:` → `case err := <-done:`."
  - kind: finding
    id: p1-o1
    phase: 1
    review_scope: in
    title: "Scaffolded acceptance-report matrix job lacks the CI-authority if:, so it also runs (and fails) on the Gitea mirror"
    body: "Found by the orchestrator on PR #46's checks (gitea-actions/acceptance-report / matrix: fail). .github/workflows/acceptance-report.yml:33 had no `if:`, unlike every ci.yml job; added in this PR by `fr acceptance init`."
  - kind: discovery
    id: p1-bisect-note
    phase: 1
    title: "Bisect note: commits 7d78940 (k8s v0.36.6) and 4144a8c (v0.37.2) carry a silently broken SPDY exec fallback, fixed in 851b2fa"
    body: "Any bisect of an attach regression that lands on those two commits should treat 851b2fa as part of them. Not folded: the commits were already pushed, and this repo's git.history is `keep` (fr push never rewrites pushed history)."
  - kind: lens
    lens: tests
    title: "The pins and CI-gate parser tests must accept every file shape Renovate (with gomodTidy, digest pinning) actually writes — reviewer-suggested renovate-compat concern"
  - kind: review
    id: p1-review-r1
    phase: 1
    title: "Phase 1 review r1: 7 findings (1 important, 6 minor, all tagged in) plus 1 orchestrator finding; 6 fixed, 2 refuted"
    body: |
      Dispatched an independent read-only reviewer over 35fec9f..65a8a22 (code paths only), against spec R1–R7, R9, R11 and plan phase 1. It re-ran tidy -diff, vet, test -race -cover and govulncheck at HEAD (all clean), confirmed PR CI green, and confirmed the SPDY fallback fix and its test are a real regression guard. Raised p1-r1..p1-r7; the orchestrator added p1-o1 from PR #46's checks.
      Received per superpowers:receiving-code-review, each verified against the code:
      - p1-r1, p1-r6 fixed test-first (TestParseGoMod, TestParseBuildStage red, then pure parsers green) in 3194bda.
      - p1-r2, p1-r3 fixed test-first (TestCIGates extended red, then ci.yml green) in 4549f11; also found that `go run` masks govulncheck's exit 3, so the scan now runs an installed binary.
      - p1-r4: spec claim corrected and the behaviour commented in ci.yml; the v6 bump stays Renovate's (R10).
      - p1-o1 fixed in b2f6b34.
      - p1-r5, p1-r7 refuted with evidence (see resolves).
resolves:
  - id: p1-r1
    state: fixed
    body: "3194bda: parseGoMod treats a missing toolchain line as equal to the go directive; TestParseGoMod covers go+toolchain, toolchain omitted, and no go directive."
  - id: p1-r2
    state: fixed
    body: "4549f11: the scan publishes govulncheck's exit code; govulncheck-issue titles exit 3 'reachable vulnerability on main' and anything else 'scheduled scan failed on main'. TestCIGates asserts both titles and the outputs wiring. The reviewer's fix would not have worked as written: `go run` turns govulncheck's exit 3 into 1, so the scan now installs and runs the binary (TestCIGates forbids `go run` there)."
  - id: p1-r3
    state: fixed
    body: "4549f11: issue filing moved to a schedule-only govulncheck-issue job (needs: govulncheck, failure() && schedule && github.com, permissions: issues: write, no checkout); the scan job is contents: read with persist-credentials: false. TestCIGates asserts each property with a line-anchored permissions match."
  - id: p1-r4
    state: fixed
    body: "8fa857c corrects the spec's false 'setup-go honours the toolchain line' claim and states v5's actual behaviour (go then fetches go1.27.4 via GOTOOLCHAIN=auto, so commands run on 1.27.4); 4549f11 comments it in ci.yml. The remaining log noise is accepted: removing it needs setup-go v6, an action-major bump R10 leaves to Renovate's first github-actions PR, and GOTOOLCHAIN=local would test on 1.27.0."
  - id: p1-r5
    state: refuted
    body: "Real, but not fixable in this PR: folding 851b2fa into 7d78940 rewrites already-pushed commits, and this repo's git.history is `keep` (fr push never rewrites or forces). Mitigated instead by the discovery p1-bisect-note, carried into the PR body, naming both commits and the fix."
  - id: p1-r6
    state: fixed
    body: "3194bda: reBuildStage accepts an optional @sha256:<hex> digest and the error names the digest form; TestParseBuildStage covers minor tag, patch tag, digest-pinned and a non-build stage."
  - id: p1-r7
    state: refuted
    body: "Verified by reverting the line and running golangci-lint v2.15.0: `internal/localterm/attacher_test.go:100:7: Error return value is not checked (errcheck)` on `case <-done:`. It is a real errcheck finding, and the change is its fix."
  - id: p1-o1
    state: fixed
    body: "b2f6b34 adds the CI-authority if: to the acceptance-report matrix job (pages, which needs it, skips with it on Gitea)."
evidence:
  review: p1-review-r1
  reviewer: aff8c2a1ea7a66e32
