<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>runs-fr</title>
    <link rel="stylesheet" href="/xterm.css" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e14;
        --panel: #11151f;
        --border: #232a39;
        --fg: #c8d0e0;
        --accent: #5ccfe6;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        height: 100vh;
        font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: var(--bg);
        color: var(--fg);
      }
      #runs {
        width: 320px;
        flex: none;
        overflow-y: auto;
        border-right: 1px solid var(--border);
        background: var(--panel);
      }
      #runs h1 {
        margin: 0;
        padding: 12px 16px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        border-bottom: 1px solid var(--border);
      }
      .run {
        display: block;
        width: 100%;
        text-align: left;
        padding: 10px 16px;
        border: 0;
        border-bottom: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      .run:hover {
        background: #161b27;
      }
      .run[aria-current="true"] {
        background: #1b2333;
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .run-id {
        font-weight: 600;
      }
      .run-meta {
        color: #7a8499;
        font-size: 12px;
        margin-top: 2px;
      }
      .empty,
      .error {
        padding: 16px;
        color: #7a8499;
      }
      .error {
        color: #ff6b6b;
      }
      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      #status {
        padding: 8px 16px;
        border-bottom: 1px solid var(--border);
        color: #7a8499;
        background: var(--panel);
      }
      #terminal {
        flex: 1;
        min-height: 0;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <nav id="runs" aria-label="Live runs"></nav>
    <section id="main">
      <div id="status">Select a run to attach.</div>
      <div id="terminal"></div>
    </section>
    <script src="/bundle.js"></script>
  </body>
</html>
